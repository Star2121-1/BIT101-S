pluginManagement {
    repositories {
        // 国内镜像放在最前：直连 Google / Maven Central 时大 jar（kotlin-compiler-embeddable
        // 等）只有 ~14KB/s 会卡死构建，镜像实测 ~1.8MB/s。镜像不可达时会自动落到下面的官方源。
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}
rootProject.name = "BIT101-S"
include ':app'
include ':api'
include ':config'
include ':data'
include ':features'
include ':features:common'
include ':features:schedule'
include ':features:web'
include ':features:map'
include ':features:setting'
include ':features:gallery'
include ':features:postedit'
include ':features:poster'
include ':features:report'
include ':features:user'
include ':features:message'
include ':features:login'
include ':features:versions'
include ':features:theme'
include ':features:seat'
include ':features:widget'
include ':features:notify'
