plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'androidx.room'
}

android {
    namespace 'cn.bit101.android.data'
    compileSdk versions.compileSdk

    defaultConfig {
        minSdk versions.minSdk
        targetSdk versions.targetSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = versions.sourceCompatibility
        targetCompatibility = versions.targetCompatibility
    }
    kotlinOptions {
        jvmTarget = versions.jvmTarget
    }

    room {
        schemaDirectory("$projectDir/schemas")
    }
}

dependencies {
    // Room 数据库
    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    testImplementation "androidx.room:room-testing:$room_version"
    testImplementation "io.mockk:mockk:1.14.5"

    // CookieJar
    implementation "net.gotev:cookie-store-okhttp:1.5.0"

    // 成绩表解析（/scores 的真实形状未验证，用通用 JsonElement 防御式处理）。
    // ⚠️ api 模块里 gson 是 implementation、不传递，这里要显式声明
    implementation "com.google.code.gson:gson:2.10.1"

    // 引用 config 模块
    implementation project(':config')

    // 需要依赖 api 模块来进行网络请求，且将该依赖传递
    api project(':api')

    // hilt
    implementation "com.google.dagger:hilt-android:${versions.hilt}"
    ksp "com.google.dagger:hilt-android-compiler:${versions.hilt}"
}
