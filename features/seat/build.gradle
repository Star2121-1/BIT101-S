plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'cn.bit101.android.features.seat'
    compileSdk versions.compileSdk

    defaultConfig {
        minSdk versions.minSdk
        targetSdk versions.targetSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = versions.sourceCompatibility
        targetCompatibility = versions.targetCompatibility
    }
    kotlinOptions {
        jvmTarget = versions.jvmTarget
    }
    buildFeatures {
        compose true
        // 供 SeatLog 使用 BuildConfig.DEBUG 区分 debug/release（AGP 8 起 library 默认关闭）
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation project(':features:common')
    implementation project(':features:theme')
    implementation project(':config')

    implementation "com.google.dagger:hilt-android:${versions.hilt}"
    ksp "com.google.dagger:hilt-android-compiler:${versions.hilt}"
    implementation "androidx.hilt:hilt-navigation-compose:1.1.0"

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation "com.google.accompanist:accompanist-webview:0.31.2-alpha"

    // junit 已由根 build.gradle 的 subprojects 块统一加给所有 library 模块。
    // org.json 必须显式提供真实实现：Android SDK 里的 org.json 在单元测试中是空壳，
    // 会让 parseCasUser / serializeTasks 这类纯解析逻辑的测试全部失效。
    testImplementation 'org.json:json:20231013'
}
