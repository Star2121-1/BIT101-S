plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'cn.bit101.android.features.map'
    compileSdk versions.compileSdk

    defaultConfig {
        minSdk versions.minSdk
        targetSdk versions.targetSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = versions.sourceCompatibility
        targetCompatibility = versions.targetCompatibility
    }
    kotlinOptions {
        jvmTarget = versions.jvmTarget
    }
    buildFeatures {
        compose true
        // 供日志出口按 BuildConfig.DEBUG 区分 debug/release（AGP 8 起 library 默认关闭）
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // 地图
    implementation 'ovh.plrapps:mapcompose:2.5.0'

    // 官方矢量校园图（SVG）渲染
    implementation "io.coil-kt:coil-compose:2.5.0"

    // hilt
    implementation "androidx.hilt:hilt-navigation-compose:1.1.0"
    implementation "com.google.dagger:hilt-android:${versions.hilt}"
    ksp "com.google.dagger:hilt-android-compiler:${versions.hilt}"

    implementation project(':features:common')
    // 《一格 GRID》token 层（P1）：M3 装不下的语义词 / 12 色板 / 数字排版档走 LocalGridTokens
    // （features/theme/GridTokens.kt）。theme 只依赖 common，方向不成环。
    implementation project(':features:theme')
}
