plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'cn.bit101.android.features.widget'
    compileSdk versions.compileSdk

    defaultConfig {
        minSdk versions.minSdk
        targetSdk versions.targetSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = versions.sourceCompatibility
        targetCompatibility = versions.targetCompatibility
    }
    kotlinOptions {
        jvmTarget = versions.jvmTarget
    }
    buildFeatures {
        compose true
        // 供日志出口按 BuildConfig.DEBUG 开关（AGP 8 起 library 默认关闭）
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation project(':features:common')
    implementation project(':features:theme')
    implementation project(':config')
    implementation project(':data')

    implementation "com.google.dagger:hilt-android:${versions.hilt}"
    ksp "com.google.dagger:hilt-compiler:${versions.hilt}"
    implementation "androidx.hilt:hilt-navigation-compose:1.1.0"

    // 桌面小组件。用传统 RemoteViews 方案（不是 Glance）——
    // 点击后能同步 `AppWidgetManager.updateAppWidget()` 重绘，
    // 不经过 Glance 的异步 Session（那正是「点了没反应」的根因）。
    // ⚠️ 代价：布局只能用 LinearLayout 一类的容器 + TextView，不能用 Compose。
    // 详见 WidgetViews 的类注释。

    // 跨零点换天与数据变更后的兜底刷新（最小周期 15 分钟）
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
