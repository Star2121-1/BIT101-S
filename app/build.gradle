plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'com.jaredsburrows.license' version "0.9.3" //用于生成开源声明
}

android {
    namespace 'cn.bit101.android'
    compileSdk versions.compileSdk

    defaultConfig {
        applicationId "cn.bit101.android"
        minSdk versions.minSdk
        targetSdk versions.targetSdk
        versionCode versions.versionCode
        versionName versions.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility = versions.sourceCompatibility
        targetCompatibility = versions.targetCompatibility
    }
    kotlinOptions {
        jvmTarget = versions.jvmTarget
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.test:core-ktx:1.5.0'
    implementation 'androidx.test.ext:junit-ktx:1.1.5'

    // 友盟基础组件库（所有友盟业务SDK都依赖基础组件库）
    implementation 'com.umeng.umsdk:common:+'// (必选)
    implementation 'com.umeng.umsdk:asms:+'// 必选

    implementation 'com.umeng.umsdk:apm:+' // U-APM产品包依赖，必选

    // 打包新版 Conscrypt，为旧系统提供 TLS 1.3 支持
    implementation 'org.conscrypt:conscrypt-android:2.6.1'

    // hilt
    implementation "com.google.dagger:hilt-android:${versions.hilt}"
    implementation "androidx.hilt:hilt-navigation-compose:1.1.0"
    ksp "com.google.dagger:hilt-android-compiler:${versions.hilt}"

    implementation project(':features')

    // ⚠️ 这两个是**显式**加的，不能只靠 `:features` 传递：
    // features 用 `implementation` 依赖各子模块，对 app 不可见（compileKotlin 会报
    // 「Unresolved reference」）。App.kt 需要在 Application.onCreate 里做一次启动接线
    // （组件依赖注入 + 座位→组件的数据推送），必须在代码里能直接引用到它们。
    // 之所以不改 features 为 `api`：那样会把整个子模块暴露给 :features 的所有下游，
    // 面太大；显式声明把耦合限制在 app 一处。
    implementation project(':features:widget')
    implementation project(':features:seat')
    implementation project(':features:notify')
}

// 开源声明生成配置
licenseReport {
    generateCsvReport = false
    generateHtmlReport = false
    generateJsonReport = false
    generateTextReport = true

    copyCsvReportToAssets = false
    copyHtmlReportToAssets = false
    copyJsonReportToAssets = false
    copyTextReportToAssets = true
}
