plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
}

// ⚠️ 这里曾经被写死成 JDK 25（当年为了绕开本机只装了 JDK 25 的环境），
// 但那会让别的机器 / CI 直接编译失败。改为与全仓其它模块同源（versions.*，当前 17）：
// 编译仍用运行 Gradle 的 JDK，只是**目标字节码**是 17。
java {
    sourceCompatibility = versions.sourceCompatibility
    targetCompatibility = versions.targetCompatibility
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = versions.jvmTarget
    }
}

dependencies {
    // Retrofit，需要下传依赖
    api "com.squareup.retrofit2:retrofit:2.9.0"
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'

    // 解析 HTML
    implementation 'org.jsoup:jsoup:1.15.4'

    // 处理 iCal 格式的日历文件
    implementation("org.mnode.ical4j:ical4j:3.2.11") {
        // exclude modules which are in conflict with system libraries
        exclude group: 'commons-logging'
        exclude group: 'org.json', module: 'json'
        // exclude groovy because we don't need it
        exclude group: 'org.codehaus.groovy', module: 'groovy'
        exclude group: 'org.codehaus.groovy', module: 'groovy-dateutil'
    }

    api 'com.github.BIT101-dev.BIT-Login:bit-login:v4.0.2'
}
// ── 调试探针：独立源码集 `src/probe` ─────────────────────────────────────────
// ⚠️ 不能放 main：app 的 release 是 minifyEnabled=false，main 的类会原样打进发布包，
// 而探针含 main() 且会拿真实账号走 CAS 登录 —— 属调试工具，不该随包发布。
sourceSets {
    probe {
        kotlin.srcDir 'src/probe/kotlin'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    probeImplementation.extendsFrom implementation
    probeRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    // 只有探针用 coroutines（runBlocking），main 不依赖它
    probeImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
}

// 用法：`gradlew :api:runProbe -Psid=<学号> -Ppwd=<密码>`（SMS 验证码写 api/sms.txt）
tasks.register("runProbe", JavaExec) {
    group = "probe"
    description = "CAS 登录校内站点抓数据（凭据走 -P 参数，不落盘）"
    classpath = sourceSets.probe.runtimeClasspath
    mainClass = "cn.bit101.api.probe.CampusCardProbeKt"
    standardInput = System.in
    environment("probe.sid", project.findProperty("sid") ?: "")
    environment("probe.pwd", project.findProperty("pwd") ?: "")
    environment("probe.sms", project.findProperty("sms") ?: "")
}
